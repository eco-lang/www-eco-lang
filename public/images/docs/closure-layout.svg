<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 328" width="700" height="328" role="img">
<title>Closure object layout</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646464"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif}.n{font-size:13px;fill:#242424}.l{font-size:11.5px;fill:#646464}.m{font-family:"Roboto Mono",monospace;font-size:12px;fill:#242424}.h{font-size:13px;font-weight:600;fill:#242424}</style>
<text class="h" x="20.0" y="24.0" text-anchor="start">A closure on the heap, and the static descriptor it points to</text>
<rect x="20.0" y="56.0" width="330.0" height="44.0" rx="4" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="l" x="30.0" y="74.0" text-anchor="start">header</text>
<text class="n" x="30.0" y="91.0" text-anchor="start">tag = Closure, size</text>
<rect x="20.0" y="100.0" width="330.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="30.0" y="118.0" text-anchor="start">arity word</text>
<text class="n" x="30.0" y="135.0" text-anchor="start">arguments held (n_values) / taken (max_values)</text>
<rect x="20.0" y="144.0" width="330.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="30.0" y="162.0" text-anchor="start">evaluator</text>
<text class="n" x="30.0" y="179.0" text-anchor="start">pointer to the descriptor</text>
<rect x="20.0" y="188.0" width="330.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="30.0" y="206.0" text-anchor="start">values[0]</text>
<text class="n" x="30.0" y="223.0" text-anchor="start">first captured or applied argument</text>
<rect x="20.0" y="232.0" width="330.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="30.0" y="250.0" text-anchor="start">values[…]</text>
<text class="n" x="30.0" y="267.0" text-anchor="start">…</text>
<text class="h" x="440.0" y="90.0" text-anchor="start">evaluator descriptor (static data)</text>
<rect x="440.0" y="100.0" width="250.0" height="40.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="m" x="450.0" y="117.0" text-anchor="start">generic</text>
<text class="l" x="450.0" y="133.0" text-anchor="start">uniform entry point</text>
<rect x="440.0" y="140.0" width="250.0" height="40.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="m" x="450.0" y="157.0" text-anchor="start">kinds</text>
<text class="l" x="450.0" y="173.0" text-anchor="start">argument kinds</text>
<rect x="440.0" y="180.0" width="250.0" height="40.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="m" x="450.0" y="197.0" text-anchor="start">stage_arity</text>
<text class="l" x="450.0" y="213.0" text-anchor="start">arguments this stage takes</text>
<rect x="440.0" y="220.0" width="250.0" height="40.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="m" x="450.0" y="237.0" text-anchor="start">sat[n]</text>
<text class="l" x="450.0" y="253.0" text-anchor="start">fast entry for n new arguments</text>
<line x1="350.0" y1="166.0" x2="438.0" y2="120.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="20.0" y="302.0" text-anchor="start">The arity word also records the result kind and a 2-bit kind (pointer, Int, Float, Char)</text>
<text class="l" x="20.0" y="318.0" text-anchor="start">for each argument, so generic apply and the collector need no static type information.</text>
</svg>
