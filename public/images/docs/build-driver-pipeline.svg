<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 -4 605 683" width="605" height="683" role="img" aria-labelledby="t">
<title id="t">How the build driver runs a build</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646464"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif}.n{font-size:13px;fill:#242424}.l{font-size:11.5px;fill:#646464}</style>
<line x1="380.0" y1="62.0" x2="380.0" y2="128.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="388.0" y="99.0" text-anchor="start">flags</text>
<line x1="380.0" y1="182.0" x2="380.0" y2="248.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="388.0" y="219.0" text-anchor="start">settings and hash</text>
<line x1="380.0" y1="302.0" x2="380.0" y2="368.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="388.0" y="339.0" text-anchor="start">module states</text>
<line x1="336.4" y1="422.0" x2="213.6" y2="498.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="213.4" y="443.5" width="123.2" height="33" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="275.0" y="456.5" text-anchor="middle">untyped graphs</text>
<text class="l" x="275.0" y="471.5" text-anchor="middle">(JavaScript, HTML)</text>
<line x1="423.6" y1="422.0" x2="560.1" y2="506.5" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="443.1" y="447.8" width="97.6" height="33" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="491.9" y="460.8" text-anchor="middle">typed graphs</text>
<text class="l" x="491.9" y="475.8" text-anchor="middle">(MLIR, native)</text>
<line x1="590.0" y1="543.5" x2="590.0" y2="613.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="598.0" y="582.2" text-anchor="start">MLIR bytecode</text>
<rect x="310.5" y="8.0" width="139.0" height="54.0" rx="6" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="380.0" y="31.0" text-anchor="middle">command line</text>
<text class="n" x="380.0" y="48.0" text-anchor="middle">or JSON request</text>
<rect x="277.2" y="128.0" width="205.6" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="380.0" y="151.0" text-anchor="middle">lock project, find root,</text>
<text class="n" x="380.0" y="168.0" text-anchor="middle">read settings</text>
<rect x="258.7" y="248.0" width="242.6" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="380.0" y="271.0" text-anchor="middle">project details:</text>
<text class="n" x="380.0" y="288.0" text-anchor="middle">solve, verify, build packages</text>
<rect x="295.7" y="368.0" width="168.6" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="380.0" y="391.0" text-anchor="middle">crawl imports,</text>
<text class="n" x="380.0" y="408.0" text-anchor="middle">compile in parallel</text>
<rect x="104.2" y="498.0" width="131.6" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="170.0" y="521.0" text-anchor="middle">Elm JavaScript</text>
<text class="n" x="170.0" y="538.0" text-anchor="middle">generator</text>
<rect x="505.7" y="506.5" width="168.6" height="37.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="590.0" y="529.5" text-anchor="middle">whole-program steps</text>
<rect x="494.6" y="613.0" width="190.8" height="54.0" rx="6" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="590.0" y="636.0" text-anchor="middle">MLIR file or</text>
<text class="n" x="590.0" y="653.0" text-anchor="middle">in-process native link</text>
</svg>
