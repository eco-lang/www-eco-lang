<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img">
<title>Heap layout: old generation and nursery</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646464"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif}.n{font-size:13px;fill:#242424}.l{font-size:11.5px;fill:#646464}.m{font-family:"Roboto Mono",monospace;font-size:12px;fill:#242424}.h{font-size:13px;font-weight:600;fill:#242424}</style>
<text class="h" x="20.0" y="24.0" text-anchor="start">One reserved address range per process (below 2^43)</text>
<rect x="20.0" y="60.0" width="440.0" height="70.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="240.0" y="52.0" text-anchor="middle">old generation: never moves</text>
<rect x="26.0" y="68.0" width="148.0" height="54.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="100.0" y="91.0" text-anchor="middle">uniform blocks</text>
<text class="l" x="100.0" y="108.0" text-anchor="middle">one size class each</text>
<rect x="186.0" y="68.0" width="138.0" height="54.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="255.0" y="91.0" text-anchor="middle">mixed blocks</text>
<text class="l" x="255.0" y="108.0" text-anchor="middle">several sizes</text>
<rect x="336.0" y="68.0" width="118.0" height="54.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="395.0" y="91.0" text-anchor="middle">large payloads</text>
<text class="l" x="395.0" y="108.0" text-anchor="middle">strings, bytes</text>
<rect x="480.0" y="60.0" width="260.0" height="70.0" rx="4" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="l" x="610.0" y="52.0" text-anchor="middle">nursery: young objects, copied</text>
<rect x="486.0" y="68.0" width="100.0" height="54.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="536.0" y="91.0" text-anchor="middle">survivor</text>
<text class="l" x="536.0" y="108.0" text-anchor="middle">extents</text>
<rect x="592.0" y="68.0" width="142.0" height="54.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="n" x="663.0" y="91.0" text-anchor="middle">eden</text>
<text class="l" x="663.0" y="108.0" text-anchor="middle">bump allocation</text>
<text class="l" x="20.0" y="152.0" text-anchor="start">low addresses</text>
<text class="l" x="740.0" y="152.0" text-anchor="end">high addresses</text>
<text class="n" x="20.0" y="180.0" text-anchor="start">1. Compiled code allocates in eden by bumping a pointer; one compare tests both “full” and “time to collect”.</text>
<text class="n" x="20.0" y="199.0" text-anchor="start">2. A minor collection copies eden’s survivors into a survivor extent.</text>
<text class="n" x="20.0" y="218.0" text-anchor="start">3. A background thread later promotes (tenures) survivors that are still live into the old generation.</text>
<text class="n" x="20.0" y="237.0" text-anchor="start">4. The old generation is marked by background threads while the program runs, then swept.</text>
</svg>
