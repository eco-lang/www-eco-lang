<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 12 723 416" width="723" height="416" role="img" aria-labelledby="t">
<title id="t">Threads in a running Eco program and what passes between them</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646464"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif}.n{font-size:13px;fill:#242424}.l{font-size:11.5px;fill:#646464}</style>
<line x1="182.1" y1="60.0" x2="341.6" y2="60.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="206.7" y="19.5" width="110.4" height="33" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="261.9" y="32.5" text-anchor="middle">port messages as</text>
<text class="l" x="261.9" y="47.5" text-anchor="middle">serialized JSON</text>
<line x1="606.8" y1="60.0" x2="458.4" y2="60.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="471.0" y="19.5" width="123.2" height="33" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="532.6" y="32.5" text-anchor="middle">plain data:</text>
<text class="l" x="532.6" y="47.5" text-anchor="middle">results and tokens</text>
<line x1="400.0" y1="78.5" x2="400.0" y2="203.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="392.0" y="137.2" text-anchor="end">drained by</text>
<text class="l" x="392.0" y="152.2" text-anchor="end">the scheduler</text>
<line x1="444.5" y1="203.0" x2="621.5" y2="95.5" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="484.2" y="140.2" width="97.6" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="533.0" y="153.2" text-anchor="middle">plain requests</text>
<line x1="400.0" y1="257.0" x2="400.0" y2="371.5" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="408.0" y="318.2" text-anchor="start">allocate and read</text>
<line x1="185.8" y1="390.0" x2="356.4" y2="390.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="190.3" y="351.5" width="161.6" height="33" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="271.1" y="364.5" text-anchor="middle">mark and promote under</text>
<text class="l" x="271.1" y="379.5" text-anchor="middle">the collector's protocol</text>
<rect x="57.9" y="33.0" width="124.2" height="54.0" rx="6" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="120.0" y="56.0" text-anchor="middle">host thread,</text>
<text class="n" x="120.0" y="73.0" text-anchor="middle">when embedded</text>
<rect x="341.6" y="41.5" width="116.8" height="37.0" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="n" x="400.0" y="64.5" text-anchor="middle">ready queues</text>
<rect x="606.8" y="24.5" width="146.4" height="71.0" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="n" x="680.0" y="47.5" text-anchor="middle">service threads:</text>
<text class="n" x="680.0" y="64.5" text-anchor="middle">timers, HTTP,</text>
<text class="n" x="680.0" y="81.5" text-anchor="middle">process waits</text>
<rect x="304.6" y="203.0" width="190.8" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="400.0" y="226.0" text-anchor="middle">eco thread:</text>
<text class="n" x="400.0" y="243.0" text-anchor="middle">scheduler and Elm code</text>
<rect x="356.4" y="371.5" width="87.2" height="37.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="400.0" y="394.5" text-anchor="middle">Elm heap</text>
<rect x="54.2" y="363.0" width="131.6" height="54.0" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="n" x="120.0" y="386.0" text-anchor="middle">collector</text>
<text class="n" x="120.0" y="403.0" text-anchor="middle">helper threads</text>
</svg>
