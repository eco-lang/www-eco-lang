<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img">
<title>Heap layout of a Cons cell holding the Int 5</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646464"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif}.n{font-size:13px;fill:#242424}.l{font-size:11.5px;fill:#646464}.m{font-family:"Roboto Mono",monospace;font-size:12px;fill:#242424}.h{font-size:13px;font-weight:600;fill:#242424}</style>
<text class="h" x="20.0" y="24.0" text-anchor="start">5 :: rest   as a heap object (24 bytes)</text>
<text class="l" x="72.0" y="83.0" text-anchor="end">+0</text>
<rect x="80.0" y="56.0" width="230.0" height="46.0" rx="4" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="l" x="90.0" y="75.0" text-anchor="start">header</text>
<text class="m" x="90.0" y="92.0" text-anchor="start">0x00000018_00000406</text>
<text class="l" x="72.0" y="129.0" text-anchor="end">+8</text>
<rect x="80.0" y="102.0" width="230.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="90.0" y="121.0" text-anchor="start">head</text>
<text class="m" x="90.0" y="138.0" text-anchor="start">5   (raw i64)</text>
<text class="l" x="72.0" y="175.0" text-anchor="end">+16</text>
<rect x="80.0" y="148.0" width="230.0" height="46.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.4"/>
<text class="l" x="90.0" y="167.0" text-anchor="start">tail</text>
<text class="m" x="90.0" y="184.0" text-anchor="start">pointer to rest</text>
<line x1="310.0" y1="171.0" x2="370.0" y2="171.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="372.0" y="154.0" width="90.0" height="34.0" rx="4" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="417.0" y="176.0" text-anchor="middle">rest</text>
<text class="h" x="350.0" y="66.0" text-anchor="start">header fields</text>
<text class="m" x="350.0" y="88.0" text-anchor="start">tag = 6</text>
<text class="l" x="490.0" y="88.0" text-anchor="start">Cons</text>
<text class="m" x="350.0" y="107.0" text-anchor="start">unboxed = 01</text>
<text class="l" x="490.0" y="107.0" text-anchor="start">head is a raw Int (bit 10)</text>
<text class="m" x="350.0" y="126.0" text-anchor="start">size = 24</text>
<text class="l" x="490.0" y="126.0" text-anchor="start">upper 32 bits</text>
<text class="m" x="350.0" y="145.0" text-anchor="start">age, pin, builder</text>
<text class="l" x="490.0" y="145.0" text-anchor="start">collector bookkeeping</text>
</svg>
