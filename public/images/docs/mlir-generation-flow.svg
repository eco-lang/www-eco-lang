<svg xmlns="http://www.w3.org/2000/svg" viewBox="174 -4 530 644" width="530" height="644" role="img" aria-labelledby="t">
<title id="t">How MLIR generation walks the specialized graph</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646464"/></marker></defs>
<style>text{font-family:Inter,system-ui,sans-serif}.n{font-size:13px;fill:#242424}.l{font-size:11.5px;fill:#646464}</style>
<line x1="300.0" y1="62.0" x2="300.0" y2="131.5" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="308.0" y="100.8" text-anchor="start">tables built once</text>
<line x1="300.0" y1="168.5" x2="300.0" y2="228.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="364.8" y1="282.0" x2="514.8" y2="344.5" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="365.4" y="296.8" width="148.8" height="33" fill="#FFFFFF" fill-opacity="0.92"/>
<text class="l" x="439.8" y="309.8" text-anchor="middle">queued closure bodies,</text>
<text class="l" x="439.8" y="324.8" text-anchor="middle">kernels called</text>
<line x1="300.0" y1="282.0" x2="300.0" y2="473.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="292.0" y="366.5" text-anchor="end">one function,</text>
<text class="l" x="292.0" y="381.5" text-anchor="end">per-function</text>
<text class="l" x="292.0" y="396.5" text-anchor="end">state cleared</text>
<line x1="511.2" y1="415.5" x2="367.5" y2="473.0" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="300.0" y1="527.0" x2="300.0" y2="591.5" stroke="#646464" stroke-width="1.4" marker-end="url(#a)"/>
<text class="l" x="308.0" y="563.2" text-anchor="start">bytecode file</text>
<rect x="186.1" y="8.0" width="227.8" height="54.0" rx="6" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="300.0" y="31.0" text-anchor="middle">specialized graph</text>
<text class="n" x="300.0" y="48.0" text-anchor="middle">with call and closure facts</text>
<rect x="260.1" y="131.5" width="79.8" height="37.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="300.0" y="154.5" text-anchor="middle">context</text>
<rect x="215.7" y="228.0" width="168.6" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="300.0" y="251.0" text-anchor="middle">each specialization</text>
<text class="n" x="300.0" y="268.0" text-anchor="middle">in id order</text>
<rect x="508.3" y="344.5" width="183.4" height="71.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="600.0" y="367.5" text-anchor="middle">closure bodies, main,</text>
<text class="n" x="600.0" y="384.5" text-anchor="middle">kernel declarations,</text>
<text class="n" x="600.0" y="401.5" text-anchor="middle">type table</text>
<rect x="208.3" y="473.0" width="183.4" height="54.0" rx="6" fill="#F1F8F1" stroke="#4CAF50" stroke-width="1.4"/>
<text class="n" x="300.0" y="496.0" text-anchor="middle">bytecode encoder with</text>
<text class="n" x="300.0" y="513.0" text-anchor="middle">append-only tables</text>
<rect x="245.3" y="591.5" width="109.4" height="37.0" rx="6" fill="#F8F8F8" stroke="#BDBDBD" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="n" x="300.0" y="614.5" text-anchor="middle">C++ backend</text>
</svg>
